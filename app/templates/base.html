<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nam An Market - Unified Merchant Portal{% endblock %}</title>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ECFDF5',
                            100: '#D1FAE5',
                            500: '#10B981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065F46',
                            900: '#064E3B',
                            950: '#022C22',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', '-apple-system', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .apple-shadow {
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.02);
        }
        .apple-card {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-card:hover {
            box-shadow: 0 10px 25px -3px rgba(15, 23, 42, 0.08), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
            transform: translateY(-1px);
        }
        /* Custom Clean Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full flex flex-col bg-slate-50 text-slate-900 antialiased">

    <!-- Top Navigation Bar: Apple Retail & Merchant Pro -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- Left: Brand & Navigation Items -->
                <div class="flex items-center space-x-6 lg:space-x-8">
                    <!-- Brand Logo -->
                    <a href="/admin" class="flex items-center space-x-3 group">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-800 to-emerald-600 flex items-center justify-center text-white font-black text-sm shadow-md shadow-emerald-900/10 group-hover:scale-105 transition-transform">
                            NA
                        </div>
                        <div>
                            <div class="text-sm font-extrabold tracking-tight text-slate-900 leading-none">Nam An Market</div>
                            <div class="text-[11px] font-semibold text-emerald-700 mt-0.5">Unified Merchant Portal</div>
                        </div>
                    </a>

                    <!-- Navigation Items -->
                    <nav class="hidden md:flex items-center space-x-1.5">
                        <a href="/admin" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-1.5 {% if active_page == 'dashboard' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/80{% endif %}">
                            <svg class="w-4 h-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                            <span>Tổng quan</span>
                        </a>

                        <a href="/admin/orders" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all relative flex items-center space-x-1.5 {% if active_page == 'orders' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/80{% endif %}">
                            <svg class="w-4 h-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                            <span>Điều phối đơn</span>
                            <span id="nav-pending-orders-badge" class="hidden px-2 py-0.5 text-[10px] font-mono font-bold rounded-full bg-amber-400 text-slate-950 ml-1">0</span>
                        </a>

                        <a href="/admin/inventory" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-1.5 {% if active_page == 'inventory' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/80{% endif %}">
                            <svg class="w-4 h-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                            <span>Kho & Tồn ERP</span>
                        </a>

                        <a href="/admin/reports" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-1.5 {% if active_page == 'reports' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/80{% endif %}">
                            <svg class="w-4 h-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                            <span>Báo cáo</span>
                        </a>

                        <a href="/system-status" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all relative flex items-center space-x-1.5 {% if active_page == 'system_status' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/80{% endif %}">
                            <svg class="w-4 h-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            <span>Hệ thống</span>
                            <span id="nav-error-badge" class="hidden px-2 py-0.5 text-[10px] font-mono font-bold rounded-full bg-rose-500 text-white ml-1">0</span>
                        </a>

                        <a href="/admin/users" id="nav-users-link" class="hidden px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-1.5 {% if active_page == 'users' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/80{% endif %}">
                            <svg class="w-4 h-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            <span>Phân quyền</span>
                        </a>
                    </nav>
                </div>

                <!-- Right: Status Indicator & User Profile Pill -->
                <div class="flex items-center space-x-3">
                    <!-- Live Server & ERP Indicator -->
                    <div id="system-status-indicator" class="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-100 border border-slate-200/80 text-xs font-semibold text-slate-700">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="system-status-text">4 Chi nhánh ERP</span>
                    </div>

                    <!-- User Account / Profile Pill -->
                    <div class="flex items-center space-x-2.5 pl-3 border-l border-slate-200">
                        <div class="text-right hidden sm:block">
                            <div id="user-display-name" class="text-xs font-bold text-slate-900 leading-tight">Quản trị viên</div>
                            <div class="flex items-center space-x-1.5 justify-end mt-0.5">
                                <span id="user-store-badge" class="hidden text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 font-mono font-bold border border-blue-200">10001</span>
                                <span id="user-role-badge" class="text-[10px] font-mono font-bold text-slate-500">SUPER_ADMIN</span>
                            </div>
                        </div>

                        <!-- Logout Button -->
                        <button onclick="logoutAdmin()" title="Đăng xuất" class="p-2 rounded-xl text-slate-500 hover:text-rose-600 hover:bg-rose-50 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                            </svg>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Modern Apple-style Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Global Client Scripts -->
    <script>
        // API Base Token Manager
        const TokenManager = {
            getToken() {
                return localStorage.getItem("naman_access_token") || "";
            },
            getRefreshToken() {
                return localStorage.getItem("naman_refresh_token") || "";
            },
            setTokens(access, refresh) {
                localStorage.setItem("naman_access_token", access);
                if (refresh) localStorage.setItem("naman_refresh_token", refresh);
            },
            clear() {
                localStorage.removeItem("naman_access_token");
                localStorage.removeItem("naman_refresh_token");
                localStorage.removeItem("naman_user_profile");
            },
            getUser() {
                try {
                    return JSON.parse(localStorage.getItem("naman_user_profile") || "{}");
                } catch(e) {
                    return {};
                }
            },
            setUser(user) {
                localStorage.setItem("naman_user_profile", JSON.stringify(user));
            }
        };

        // Modern Apple Toast Notification
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let colorClass = 'bg-white text-slate-900 border-slate-200/80';
            let iconSvg = '<svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';

            if (type === 'error') {
                colorClass = 'bg-rose-50 text-rose-900 border-rose-200';
                iconSvg = '<svg class="w-4 h-4 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
            } else if (type === 'success') {
                colorClass = 'bg-emerald-50 text-emerald-950 border-emerald-200';
                iconSvg = '<svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
            }

            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl apple-shadow border ${colorClass} flex items-center space-x-3 text-xs font-semibold transition-all duration-300 transform translate-y-3 opacity-0`;
            
            toast.innerHTML = `
                <div class="shrink-0">${iconSvg}</div>
                <div class="flex-1 leading-snug">${message}</div>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-700 ml-2 font-bold p-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-3', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3800);
        }

        // Authenticated Fetch wrapper
        async function authFetch(url, options = {}) {
            let token = TokenManager.getToken();
            options.headers = options.headers || {};
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            if (options.body && typeof options.body === 'string' && !options.headers['Content-Type']) {
                options.headers['Content-Type'] = 'application/json';
            }

            let res = await fetch(url, options);
            if (res.status === 401) {
                const refresh = TokenManager.getRefreshToken();
                if (refresh) {
                    try {
                        const refreshRes = await fetch('/api/v1/auth/refresh', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ refresh_token: refresh })
                        });
                        if (refreshRes.ok) {
                            const refData = await refreshRes.json();
                            if (refData.success && refData.data) {
                                TokenManager.setTokens(refData.data.access_token, refData.data.refresh_token);
                                options.headers['Authorization'] = `Bearer ${refData.data.access_token}`;
                                return await fetch(url, options);
                            }
                        }
                    } catch(e) {}
                }
                TokenManager.clear();
                if (!window.location.pathname.includes('/login')) {
                    window.location.href = '/admin/login?redirect=' + encodeURIComponent(window.location.pathname);
                }
            }
            return res;
        }

        // Logout
        async function logoutAdmin() {
            try {
                await authFetch('/api/v1/auth/logout', {
                    method: 'POST',
                    body: JSON.stringify({ refresh_token: TokenManager.getRefreshToken() })
                });
            } catch(e) {}
            TokenManager.clear();
            window.location.href = '/admin/login';
        }

        function renderHeaderUserInfo(user) {
            if (!user) return;
            const nameEl = document.getElementById('user-display-name');
            const roleEl = document.getElementById('user-role-badge');
            const storeEl = document.getElementById('user-store-badge');
            const navUsersLink = document.getElementById('nav-users-link');

            if (nameEl && user.full_name) nameEl.textContent = user.full_name;
            if (roleEl && user.role) roleEl.textContent = user.role;
            if (storeEl) {
                if (user.store_code) {
                    storeEl.textContent = `CN ${user.store_code}`;
                    storeEl.title = user.store_name ? `${user.store_name} (${user.store_code})` : user.store_code;
                    storeEl.classList.remove('hidden');
                } else {
                    storeEl.textContent = 'Toàn chuỗi';
                    storeEl.classList.remove('hidden');
                }
            }
            if (navUsersLink) {
                if (user.role === 'SUPER_ADMIN' || user.is_superuser) {
                    navUsersLink.classList.remove('hidden');
                } else {
                    navUsersLink.classList.add('hidden');
                }
            }
        }

        async function refreshNavOrdersBadge() {
            const navBadge = document.getElementById('nav-pending-orders-badge');
            if (!navBadge || !TokenManager.getToken()) return;
            try {
                const res = await authFetch('/api/v1/haravan/incomplete-count');
                if (res.ok) {
                    const json = await res.json();
                    const count = (json.data && json.data.count) || 0;
                    if (count > 0) {
                        navBadge.textContent = count;
                        navBadge.classList.remove('hidden');
                    } else {
                        navBadge.classList.add('hidden');
                    }
                }
            } catch (e) {}
        }

        // Auto load user profile
        document.addEventListener('DOMContentLoaded', async () => {
            let user = TokenManager.getUser();
            if (user && user.username) {
                renderHeaderUserInfo(user);
            }
            if (TokenManager.getToken()) {
                try {
                    const res = await authFetch('/api/v1/auth/me');
                    if (res.ok) {
                        const data = await res.json();
                        if (data.success && data.data) {
                            TokenManager.setUser(data.data);
                            renderHeaderUserInfo(data.data);
                            window.dispatchEvent(new CustomEvent('currentUserLoaded', { detail: data.data }));
                        }
                    }
                    refreshNavOrdersBadge();
                } catch(e) {}
            }
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>

services:
  # ============================================================================
  # 1. FastAPI Backend Application Container
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: naman_portal_app
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      # Connect to PostgreSQL running locally on the Host machine
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@host.docker.internal:5432/naman_merchant_portal
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Allows the container to access PostgreSQL service on the host machine
      - "host.docker.internal:host-gateway"
    expose:
      - "2223"
    networks:
      - naman_internal_net

  # ============================================================================
  # 2. Container-Level Nginx Reverse Proxy (Bundled in Docker)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: naman_portal_nginx
    restart: always
    ports:
      # Expose port 2222 to host machine -> Host-Level Nginx proxy_pass into 127.0.0.1:2222
      - "127.0.0.1:2222:2222"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - naman_internal_net

# NOTE: PostgreSQL database is NOT run in Docker.
# It runs directly as a local service on the host machine (Port 5432).

networks:
  naman_internal_net:
    driver: bridge

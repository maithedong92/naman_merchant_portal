services:
  # ============================================================================
  # 1. FastAPI Backend Application Container
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: naman_portal_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    extra_hosts:
      # Allows the container to access services on the host machine if needed
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    expose:
      - "3002"
    networks:
      - naman_internal_net

  # ============================================================================
  # 2. Container-Level Nginx Reverse Proxy (Bundled in Docker)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: naman_portal_nginx
    restart: always
    ports:
      # Expose port 3001 to host machine -> Host-Level Nginx proxy_pass into 127.0.0.1:3001
      - "127.0.0.1:3001:3001"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health-check || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
    networks:
      - naman_internal_net

# NOTE: PostgreSQL database is NOT run in Docker.
# It runs directly as a local service on the host machine (Port 5432).

networks:
  naman_internal_net:
    driver: bridge

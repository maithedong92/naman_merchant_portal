services:
  # ============================================================================
  # 1. FastAPI Backend Application Container
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: naman_portal_app
    restart: always
    env_file:
      - .env
    extra_hosts:
      # Allows the container to access services on the host machine if needed
      - "host.docker.internal:host-gateway"

    expose:
      - "3002"
    networks:
      - naman_internal_net

  # ============================================================================
  # 2. Container-Level Nginx Reverse Proxy (Bundled in Docker)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: naman_portal_nginx
    restart: always
    ports:
      # Expose port 3001 to host machine -> Host-Level Nginx proxy_pass into 127.0.0.1:3001
      - "127.0.0.1:3001:3001"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - naman_internal_net

# NOTE: PostgreSQL database is NOT run in Docker.
# It runs directly as a local service on the host machine (Port 5432).

networks:
  naman_internal_net:
    driver: bridge

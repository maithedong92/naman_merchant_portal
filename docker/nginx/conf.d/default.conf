# Nginx configuration inside Docker (Internal Container Reverse Proxy)
upstream fastapi_app {
    server app:2223;
    keepalive 32;
}

server {
    listen 2222;
    server_name _;

    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts for external channel webhooks and sync payloads
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Health check probe
    location /health-check {
        access_log off;
        return 200 "nginx-container-ok";
    }

    # Proxy to FastAPI backend
    location / {
        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for WebSockets or server-sent events
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naman-merchant-portal"
version = "1.0.0"
description = "Nam An Market Unified Multi-Channel Merchant Portal"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mai The Dong", email = "maithedong92@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.1.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
